name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *'    # 8h UTC chaque jour
    - cron: '0 14 * * *'   # 14h UTC chaque jour
    - cron: '0 20 * * *'   # 20h UTC chaque jour
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Connect and query database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            -h aws-1-eu-west-1.pooler.supabase.com \
            -p 5432 \
            -U "postgres.whsxgofhinunbcotwnro" \
            -d postgres \
            -c "SELECT COUNT(*) FROM sectors; SELECT COUNT(*) FROM reviews; SELECT COUNT(*) FROM media;"
          echo "✅ Database queried successfully - $(date)"
